<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Product Catalog Search Matrix</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f7fc;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
color:#222;
}

.search-panel{
display:grid;
grid-template-columns:280px 1fr;
gap:20px;
}

.filters{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
height:fit-content;
}

.filters h3{
margin-bottom:15px;
}

.search-box{
width:100%;
padding:12px;
border:2px solid #ddd;
border-radius:8px;
margin-bottom:20px;
}

.checkbox-group label{
display:block;
margin:10px 0;
cursor:pointer;
}

.slider-value{
font-weight:bold;
color:#0066ff;
margin-top:10px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card h2{
font-size:20px;
margin-bottom:10px;
}

.category{
color:#666;
font-size:14px;
}

.price{
font-size:22px;
color:green;
font-weight:bold;
margin-top:10px;
}

.not-found{
grid-column:1/-1;
text-align:center;
font-size:24px;
color:red;
padding:30px;
}
</style>
</head>
<body>

<div class="container">

<h1>🛒 Product Catalog Search Matrix</h1>

<div class="search-panel">

<div class="filters">

<input
type="text"
id="searchInput"
class="search-box"
placeholder="Search Products..."
>

<h3>Categories</h3>

<div class="checkbox-group">
<label>
<input type="checkbox" value="Electronics" checked>
 Electronics
</label>

<label>
<input type="checkbox" value="Fashion" checked>
 Fashion
</label>

<label>
<input type="checkbox" value="Sports" checked>
 Sports
</label>

<label>
<input type="checkbox" value="Furniture" checked>
 Furniture
</label>
</div>

<br>

<h3>Maximum Price</h3>

<input
type="range"
id="priceSlider"
min="1000"
max="100000"
value="100000"
style="width:100%;"
>

<div class="slider-value">
₹<span id="priceValue">100000</span>
</div>

</div>

<div class="products" id="productContainer"></div>

</div>

</div>

<script>

const products = [

{
name:"Gaming Laptop",
category:"Electronics",
price:75000,
image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"
},

{
name:"Smart Phone",
category:"Electronics",
price:45000,
image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"
},

{
name:"Running Shoes",
category:"Sports",
price:5000,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"
},

{
name:"Office Chair",
category:"Furniture",
price:9000,
image:"https://images.unsplash.com/photo-1505843490701-5be5d6a0f88d"
},

{
name:"Wooden Table",
category:"Furniture",
price:12000,
image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
},

{
name:"Men Jacket",
category:"Fashion",
price:3500,
image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
},

{
name:"Football",
category:"Sports",
price:2000,
image:"https://images.unsplash.com/photo-1574629810360-7efbbe195018"
},

{
name:"Women's Handbag",
category:"Fashion",
price:4500,
image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3"
}

];

const container = document.getElementById("productContainer");
const searchInput = document.getElementById("searchInput");
const priceSlider = document.getElementById("priceSlider");
const priceValue = document.getElementById("priceValue");

function renderProducts(){

const searchText =
searchInput.value.toLowerCase();

const selectedCategories =
[...document.querySelectorAll("input[type='checkbox']:checked")]
.map(c=>c.value);

const maxPrice =
parseInt(priceSlider.value);

let filtered = products.filter(product =>

product.name.toLowerCase().includes(searchText)

&&

selectedCategories.includes(product.category)

&&

product.price <= maxPrice

);

container.innerHTML="";

if(filtered.length===0){

container.innerHTML=
`<div class="not-found">
No Products Found
</div>`;

return;
}

filtered.forEach(product=>{

container.innerHTML += `

<div class="card">

<img src="${product.image}" alt="">

<div class="card-content">

<h2>${product.name}</h2>

<div class="category">
${product.category}
</div>

<div class="price">
₹${product.price.toLocaleString()}
</div>

</div>

</div>

`;

});

}

searchInput.addEventListener(
"input",
renderProducts
);

priceSlider.addEventListener(
"input",
()=>{
priceValue.textContent=priceSlider.value;
renderProducts();
}
);

document
.querySelectorAll("input[type='checkbox']")
.forEach(box=>
box.addEventListener(
"change",
renderProducts
)
);

renderProducts();

</script>

</body>
</html>
